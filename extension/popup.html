<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ApplyWise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif;
      font-size: 14px;
      background: #f8f7ff;
      color: #1a1a2e;
    }
    .header {
      background: #534AB7;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
    }
    .header-text h1 { font-size: 15px; font-weight: 700; color: white; }
    .header-text p { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }
    .content { padding: 16px; }

    /* Login */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; font-weight: 500; }
    input {
      width: 100%; padding: 8px 10px;
      border: 1.5px solid #e5e7eb; border-radius: 8px;
      color: #1a1a2e; font-size: 13px; outline: none;
      background: white;
    }
    input:focus { border-color: #534AB7; }
    .btn {
      width: 100%; padding: 9px; background: #534AB7;
      color: white; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #4338a0; }
    .btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-danger {
      background: none; color: #ef4444;
      border: 1.5px solid #ef4444; margin-top: 8px;
    }
    .btn-danger:hover { background: #fef2f2; }
    .btn-success {
      background: #166534; margin-top: 8px;
    }
    .btn-success:hover { background: #14532d; }
    .btn-outline {
      background: none; color: #534AB7;
      border: 1.5px solid #534AB7; margin-top: 8px;
    }
    .btn-outline:hover { background: #f3f0ff; }
    .error-msg { color: #ef4444; font-size: 12px; margin-top: 8px; text-align: center; }

    /* Loading */
    .loading {
      text-align: center; padding: 30px 16px; color: #6b7280;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #534AB7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Job check result */
    .result-card {
      border-radius: 10px; padding: 14px;
      margin-bottom: 12px;
    }
    .result-card.duplicate {
      background: #fef2f2; border: 1.5px solid #fecaca;
    }
    .result-card.new {
      background: #f0fdf4; border: 1.5px solid #bbf7d0;
    }
    .result-card.unknown {
      background: #f3f4f6; border: 1.5px solid #e5e7eb;
    }
    .result-icon { font-size: 22px; margin-bottom: 6px; }
    .result-title {
      font-size: 13px; font-weight: 700;
      margin-bottom: 4px;
    }
    .result-card.duplicate .result-title { color: #991B1B; }
    .result-card.new .result-title { color: #166534; }
    .result-card.unknown .result-title { color: #374151; }
    .result-detail {
      font-size: 12px; color: #6b7280; line-height: 1.5;
    }
    .result-detail strong { color: #1a1a2e; }

    /* Job info fields for manual add */
    .divider {
      border: none; border-top: 1px solid #e5e7eb;
      margin: 12px 0;
    }
    .section-title {
      font-size: 11px; font-weight: 600; color: #6b7280;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 12px;
    }
    .stat-card {
      background: white; border-radius: 8px;
      padding: 10px; text-align: center;
      border: 1px solid #ede9fe;
    }
    .stat-number { font-size: 20px; font-weight: 700; color: #534AB7; }
    .stat-label { font-size: 10px; color: #6b7280; margin-top: 2px; }

    .user-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; padding: 8px 10px;
      background: white; border-radius: 8px;
      border: 1px solid #ede9fe;
    }
    .user-bar-email { font-size: 11px; color: #6b7280; }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #16a34a; display: inline-block; margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">💼</div>
    <div class="header-text">
      <h1>ApplyWise</h1>
      <p>Never apply twice</p>
    </div>
  </div>

  <div class="content">

    <!-- Loading -->
    <div id="view-loading" class="loading">
      <div class="spinner"></div>
      <p>Checking this job...</p>
    </div>

    <!-- Login -->
    <div id="view-login" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button class="btn" id="login-btn">Sign in</button>
      <div id="login-error" class="error-msg"></div>
    </div>

    <!-- Job check result -->
    <div id="view-job" style="display:none">

      <div id="result-duplicate" class="result-card duplicate" style="display:none">
        <div class="result-icon">🔴</div>
        <div class="result-title">Already Applied!</div>
        <div class="result-detail" id="duplicate-detail"></div>
      </div>

      <div id="result-new" class="result-card new" style="display:none">
        <div class="result-icon">✅</div>
        <div class="result-title">Not Applied Yet</div>
        <div class="result-detail" id="new-detail"></div>
      </div>

      <div id="result-unknown" class="result-card unknown" style="display:none">
        <div class="result-icon">❓</div>
        <div class="result-title">Couldn't detect job</div>
        <div class="result-detail">Fill in the details manually below.</div>
      </div>

      <hr class="divider">
      <div class="section-title">Job Details</div>

      <div class="form-group">
        <label>Company</label>
        <input type="text" id="job-company" placeholder="e.g. Google">
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" id="job-role" placeholder="e.g. Data Analyst">
      </div>

      <button class="btn btn-success" id="add-btn" style="display:none">+ Add to Tracker</button>
      <button class="btn btn-outline" id="add-anyway-btn" style="display:none">+ Add Anyway</button>
      <button class="btn btn-outline" id="go-dashboard-btn">Open Dashboard</button>
      <button class="btn btn-danger" id="logout-btn-job">Sign out</button>
    </div>

    <!-- Stats dashboard (non-job pages) -->
    <div id="view-dashboard" style="display:none">
      <div class="user-bar">
        <div><span class="status-dot"></span><span class="user-bar-email" id="user-email"></span></div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">-</div>
          <div class="stat-label">Total applied</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-week">-</div>
          <div class="stat-label">This week</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-process">-</div>
          <div class="stat-label">In process</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-response">-</div>
          <div class="stat-label">Response rate</div>
        </div>
      </div>
      <button class="btn" id="go-dashboard-btn2">Open Dashboard</button>
      <button class="btn btn-danger" id="logout-btn">Sign out</button>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
