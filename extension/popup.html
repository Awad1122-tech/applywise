<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyWise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      min-height: 200px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: #0f172a;
      color: #f1f5f9;
    }
    .header { background: #1e40af; padding: 16px; text-align: center; }
    .header h1 { font-size: 18px; font-weight: 700; color: white; }
    .header p { font-size: 11px; color: #93c5fd; margin-top: 2px; }
    .content { padding: 16px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input {
      width: 100%; padding: 8px 10px; background: #1e293b;
      border: 1px solid #334155; border-radius: 6px;
      color: #f1f5f9; font-size: 13px; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 9px; background: #1e40af;
      color: white; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    button:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; margin-top: 12px; }
    .btn-danger:hover { background: #b91c1c; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .stat-card { background: #1e293b; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-number { font-size: 22px; font-weight: 700; color: #3b82f6; }
    .stat-label { font-size: 10px; color: #64748b; margin-top: 2px; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #16a34a; margin-right: 6px;
    }
    .logged-in-as { font-size: 11px; color: #64748b; text-align: center; margin-bottom: 12px; }
    .error { color: #f87171; font-size: 12px; margin-top: 8px; text-align: center; }
    .loading { text-align: center; color: #64748b; padding: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 ApplyWise</h1>
    <p>Never apply twice</p>
  </div>

  <div class="content">
    <div id="loading" class="loading">Loading...</div>

    <div id="login-view" style="display:none">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button id="login-btn">Login</button>
      <div id="login-error" class="error"></div>
    </div>

    <div id="dashboard-view" style="display:none">
      <div class="logged-in-as">
        <span class="status-dot"></span>
        <span id="user-email"></span>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">-</div>
          <div class="stat-label">Total applied</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-week">-</div>
          <div class="stat-label">This week</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-process">-</div>
          <div class="stat-label">In process</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-response">-</div>
          <div class="stat-label">Response rate</div>
        </div>
      </div>
      <button id="open-dashboard">Open Dashboard</button>
      <button class="btn-danger" id="logout-btn">Logout</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
